<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Snooker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎱</text></svg>"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Landscape phones are short, so every control lives in a side column
           and the table gets the full height of the screen. -->
      <aside id="left">
        <button id="pause" class="hud-btn" aria-label="Pause">❚❚</button>
        <div id="power" role="slider" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100">
          <div id="power-fill"></div>
          <div id="power-label">30%</div>
        </div>
      </aside>

      <main id="table-wrap">
        <canvas id="table"></canvas>
      </main>
      <!-- The cue while aiming: over the whole game area, side panels
           included, so it can overhang the rail like a real cue. It never
           takes a touch (see #cue-layer in style.css). -->
      <canvas id="cue-layer" aria-hidden="true"></canvas>

      <aside id="hud">
        <div class="player" id="player-a">
          <div class="avatar" id="avatar-a">A</div>
          <div class="who">
            <span class="name" id="name-a">You</span>
            <span class="frames" id="frames-a"></span>
          </div>
          <div class="score" id="score-a">0</div>
        </div>

        <div class="centre">
          <div class="clock" id="clock">--</div>
          <div class="ballon" id="ballon">on: red</div>
          <div class="breakline" id="breakline">break 0</div>
        </div>

        <div class="player" id="player-b">
          <div class="avatar" id="avatar-b">AI</div>
          <div class="who">
            <span class="name" id="name-b">AI</span>
            <span class="frames" id="frames-b"></span>
          </div>
          <div class="score" id="score-b">0</div>
        </div>

        <div id="hint"></div>
        <!-- PvP only, and only once the frame can no longer be won by potting. -->
        <button id="concede" class="concede" hidden>Concede match</button>
        <button id="shoot" class="shoot">SHOOT</button>
      </aside>

      <div id="toast" hidden></div>
      <div id="sync-badge" hidden>⏳ <span id="sync-count">0</span> queued</div>

      <!-- First screen when the Mini App opens with no mode in the URL. Sits
           over the table (which is already laid out behind it) and works
           upright, so it is not behind the #rotate guard. -->
      <section id="lobby" hidden>
        <div class="lobby-inner">
          <div class="lobby-logo">
            <!-- A red, drawn to match the renderer's ball shading (#c8202a). -->
            <svg class="logo-ball" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <radialGradient id="logo-red" cx="36%" cy="30%" r="72%">
                  <stop offset="0" stop-color="#ff938c" />
                  <stop offset="45%" stop-color="#c8202a" />
                  <stop offset="1" stop-color="#6d0d13" />
                </radialGradient>
              </defs>
              <circle cx="16" cy="16" r="15" fill="url(#logo-red)" />
            </svg>
            <span class="logo-word">Snooker</span>
          </div>

          <!-- One contained surface, so the menu lifts off the background
               instead of floating loose on it. -->
          <div class="lobby-card">
            <header class="lobby-head">
              <div class="avatar lobby-avatar" id="lobby-avatar">?</div>
              <div class="lobby-who">
                <span class="lobby-name" id="lobby-name">Player</span>
                <span class="lobby-sub" id="lobby-sub">Snooker</span>
              </div>
              <!-- Coins, tapping through to the store. Offline, the Offline chip
                   takes its place: the balance lives on the server. -->
              <button class="coin-chip" id="lobby-coins" aria-label="Coins: open the store">
                <svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin-mark" /></svg><span id="lobby-coins-value">–</span>
              </button>
              <span class="offline-chip" id="lobby-offline" hidden>⚠ Offline</span>
            </header>

            <div class="stat-row">
              <div class="stat">
                <b id="stat-points">–</b>
                <span>points</span>
              </div>
              <div class="stat">
                <b id="stat-matches">–</b>
                <span>matches won</span>
              </div>
              <div class="stat">
                <b id="stat-break">–</b>
                <span>high break</span>
              </div>
            </div>

            <!-- Reads as an allowance remaining ("15 matches left today"), not as
                 a progress bar filling up toward a limit. -->
            <div class="cap-line" id="cap-line">
              <span id="cap-value">–</span>
            </div>
            <div class="cap-bar" id="cap-bar"><div class="cap-fill" id="cap-fill"></div></div>
            <p class="cap-note" id="cap-note"></p>

            <button id="lobby-play" class="lobby-primary">PLAY</button>
            <button id="lobby-practice" class="lobby-btn">Practice</button>

            <div class="lobby-grid">
              <!-- Outlined in the cue rings' gold, not filled: PLAY stays the
                   only filled button. -->
              <button id="lobby-store" class="lobby-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                        d="M5 8h14l-1.2 12H6.2z M9 8V6.5a3 3 0 0 1 6 0V8" />
                </svg>
                Store
              </button>
              <button id="lobby-rewards" class="lobby-btn">
                <!-- A token, in currentColor so it dims with the button offline. -->
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                  <circle cx="12" cy="12" r="3.5" fill="currentColor" />
                </svg>
                Rewards
              </button>
              <button id="lobby-rules" class="lobby-btn">How to play</button>
              <button id="lobby-settings" class="lobby-btn" aria-label="Settings">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3.25" fill="none" stroke="currentColor" stroke-width="2" />
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                        d="M12 2.6l2 .5.6 2.1 1.6.9 2-.8 1.4 1.5-1 1.9.5 1.8 2 .8v2l-2 .8-.5 1.8 1 1.9-1.4 1.5-2-.8-1.6.9-.6 2.1-2 .5-2-.5-.6-2.1-1.6-.9-2 .8-1.4-1.5 1-1.9-.5-1.8-2-.8v-2l2-.8.5-1.8-1-1.9L5.8 5.3l2 .8 1.6-.9.6-2.1z" />
                </svg>
              </button>
            </div>
            <p class="offline-note" id="offline-note" hidden>
              No connection — Practice still works. PvP, Rewards and the Store need one.
            </p>
          </div>
        </div>
      </section>

      <!-- The store: a full screen of its own over the lobby, under #overlay so
           the buy confirmation opens on top of it. Filled by store.js. -->
      <section id="store" hidden>
        <div class="store-inner">
          <header class="store-head">
            <button class="store-back" id="store-back" aria-label="Back">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7" /></svg>
            </button>
            <h2>Store</h2>
            <span class="coin-chip static" id="store-coins"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin-mark" /></svg><span id="store-coins-value">–</span></span>
          </header>
          <div class="store-tabs" role="tablist">
            <button class="store-tab" role="tab" data-tab="cue">Cues</button>
            <button class="store-tab" role="tab" data-tab="ball">Cue balls</button>
            <button class="store-tab" role="tab" data-tab="coins">Coins</button>
          </div>
          <ul class="store-list" id="store-list"></ul>
          <p class="store-note" id="store-note"></p>
        </div>
      </section>

      <!-- One coin drawing, used by every coin icon on the page. -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="coin-mark" viewBox="0 0 20 20">
          <circle cx="10" cy="10" r="9" fill="#8a6a24" />
          <circle cx="10" cy="10" r="8.2" fill="#d4ad52" />
          <circle cx="10" cy="10" r="5.4" fill="none" stroke="#8a6a24" stroke-width="1.3" />
          <path d="M5 6.2a6 6 0 0 1 6.5-3" fill="none" stroke="#f6e2a8" stroke-width="1.1" stroke-linecap="round" />
        </symbol>
      </svg>

      <div id="overlay" hidden>
        <div class="sheet">
          <h2 id="overlay-title">Paused</h2>
          <div id="overlay-body"></div>
          <div id="overlay-actions"></div>
        </div>
      </div>

      <div id="rotate">
        <div>
          <div class="rot-icon">📱</div>
          <p>Turn your phone sideways to play.</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
